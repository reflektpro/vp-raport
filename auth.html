<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход Discord</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#14181a; color:#e9e6dc; font:16px/1.45 "Segoe UI", sans-serif; }
  p { max-width:420px; padding:24px; }
</style>
</head>
<body>
<p id="msg">Вхожу через Discord…</p>
<script src="config.js"></script>
<script>
(async () => {
  const msg = document.getElementById("msg");
  const q = new URLSearchParams(location.search);
  const code = q.get("code") || "";
  const state = q.get("state") || "";
  const home = "https://reflektpro.github.io/vp-raport/";
  const C = window.VP_CONFIG || {};
  const base = String(C.endpoint || "").replace(/\/$/, "");
  if (!code || !base) { msg.textContent = "Вход не удался."; return; }
  try {
    const res = await fetch(base + "/auth/discord", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, state: state })
    });
    const text = await res.text();
    if (!res.ok) { msg.textContent = text || "Вход не удался."; return; }
    let data = {};
    try { data = JSON.parse(text); } catch (e) { msg.textContent = "Вход не удался."; return; }
    if (!data.token) { msg.textContent = "Вход не удался."; return; }
    localStorage.setItem("vp_session", data.token);
    localStorage.setItem("vp_user", JSON.stringify({ id: data.id, username: data.username }));
    const back = state.indexOf("https://reflektpro.github.io/vp-raport/") === 0 ? state : home;
    location.replace(back);
  } catch (e) {
    msg.textContent = "Вход не удался.";
  }
})();
</script>
</body>
</html>
